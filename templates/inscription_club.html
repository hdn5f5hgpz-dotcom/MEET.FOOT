{% extends "base.html" %}
{% block content %}
<div class="min-h-[75vh] flex items-center justify-center">
    <div class="w-full max-w-md bg-card border border-white/10 rounded-[2rem] p-8">
        <div class="text-center">
            <div class="w-12 h-12 bg-primary rounded-xl mx-auto flex items-center justify-center text-black font-bold text-xl"><i class="fa-solid fa-user"></i></div>
            <h1 class="font-display text-4xl mt-4">{% if 'club' in request.path %}CLUB{% else %}JOUEUR{% endif %}</h1>
            <p class="text-white/40 text-sm mt-1">Cree ton compte MEET.FOOT</p>
        </div>
        <form method="POST" class="mt-8 space-y-3">
            <input name="username" placeholder="Pseudo (ex: NeymarJR_Danane)" class="w-full bg-zinc-900 border border-white/10 rounded-full px-5 py-3.5 text-sm focus:border-primary outline-none" required>
            <input name="email" type="email" placeholder="Email" class="w-full bg-zinc-900 border border-white/10 rounded-full px-5 py-3.5 text-sm focus:border-primary outline-none" required>
            <input name="password" type="password" placeholder="Mot de passe (min 6)" class="w-full bg-zinc-900 border border-white/10 rounded-full px-5 py-3.5 text-sm focus:border-primary outline-none" required>
            <input name="password_confirm" type="password" placeholder="Confirme le mot de passe" class="w-full bg-zinc-900 border border-white/10 rounded-full px-5 py-3.5 text-sm focus:border-primary outline-none">
            <button class="w-full bg-primary text-black font-bold py-3.5 rounded-full mt-2 hover:scale-[1.02] transition">Creer mon compte</button>
        </form>
        <p class="text-center text-xs text-white/30 mt-6">En t'inscrivant tu acceptes nos CGU</p>
        <p class="text-center text-sm text-white/40 mt-3">Deja un compte? <a href="{{ url_for('login') }}" class="text-primary font-bold">Connexion</a></p>
    </div>
</div>
{% endblock %}
