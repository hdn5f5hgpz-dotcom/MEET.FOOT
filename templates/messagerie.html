{% extends "base.html" %}
{% block contenu %}
<h1>Messagerie</h1>
<a class="bouton" href="{{ url_for('nouvelle_conversation') }}">Nouvelle conversation</a><hr>
{% for conv in conversations %}
<div style="background:white;padding:10px;margin-bottom:8px;border-radius:6px;">
<a href="{{ url_for('conversation', autre_email=conv.email) }}"><b>{{ conv.nom }}</b></a><br><small>{{ conv.dernier_message }}</small>
</div>
{% else %}<p>Aucune conversation</p>{% endfor %}
{% endblock %}
