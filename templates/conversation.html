{% extends "base.html" %}
{% block content %}
<div class="max-w-2xl mx-auto bg-card border border-white/10 rounded-[2rem] flex flex-col h-[75vh]">
    <div class="p-4 border-b border-white/10 flex items-center gap-3"><a href="{{ url_for('messagerie') }}"><i class="fa-solid fa-arrow-left"></i></a><div class="w-8 h-8 bg-zinc-800 rounded-full flex items-center justify-center font-bold text-sm">{{ other_user.username[0].upper() if other_user else 'U' }}</div><p class="font-bold text-sm">{{ other_user.username if other_user else 'Conversation' }}</p></div>
    <div class="flex-1 overflow-y-auto p-4 space-y-3">
        {% for msg in messages|default([]) %}
        <div class="flex {% if msg.sender_id == current_user.id %}justify-end{% endif %}"><div class="{% if msg.sender_id == current_user.id %}bg-primary text-black{% else %}bg-zinc-800{% endif %} rounded-2xl px-4 py-2 text-sm max-w-[70%]">{{ msg.contenu }}</div></div>
        {% endfor %}
    </div>
    <form method="POST" class="p-4 border-t border-white/10 flex gap-2">
        <input name="contenu" placeholder="Message..." class="flex-1 bg-zinc-900 border border-white/10 rounded-full px-5 py-3 text-sm outline-none" required>
        <button class="w-11 h-11 bg-primary rounded-full text-black flex items-center justify-center"><i class="fa-solid fa-paper-plane"></i></button>
    </form>
</div>
{% endblock %}
